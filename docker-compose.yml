services:
  db:
    image: postgres:16-alpine
    container_name: investgame_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No published port: only the backend container talks to the database.
    volumes:
      - postgresdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - game_network

  backend:
    image: investgame_backend
    build: ./backend
    container_name: investgame_backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ADMIN_KEY: ${ADMIN_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}   # set by start.py: the address players open
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:3000:3000"   # API docs at http://localhost:3000/docs, local only
    depends_on:
      db:
        condition: service_healthy
    networks:
      - game_network

  frontend:
    container_name: investgame_frontend
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - game_network

volumes:
  postgresdata:

networks:
  game_network:
    driver: bridge
