services:
  db:
    image: postgres:16-alpine
    container_name: investgame_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
      - ./backend/init_db:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - game_network

  backend:
    image: investgame_backend
    build: ./backend
    container_name: investgame_backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${PORT}
    # command: command
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - game_network

  frontend:
    container_name: investgame_frontend
    build: ./frontend
    ports:
      - "8080:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - game_network

volumes:
  postgresdata:

networks:
  game_network:
    driver: bridge